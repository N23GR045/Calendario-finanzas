<title>Mi Calendario Laboral y Finanzas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--gc:#6366f1;--gf:#10b981;--gr:#f59e0b;--gg:#64748b;--bg:#f5f6fa;--card:#fff;--tx:#1b1d27;--mu:#6b7080;--bd:#e3e5ee;--ac:#4f46e5;--acx:#fff;box-sizing:border-box;--sat:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px));--sab:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101219;--card:#1a1d28;--tx:#eef0f8;--mu:#9aa0b5;--bd:#2a2e3d;--ac:#818cf8;--acx:#10121a;--gc:#818cf8;--gf:#34d399;--gr:#fbbf24;--gg:#94a3b8}}
:root[data-theme="dark"]{--bg:#101219;--card:#1a1d28;--tx:#eef0f8;--mu:#9aa0b5;--bd:#2a2e3d;--ac:#818cf8;--acx:#10121a;--gc:#818cf8;--gf:#34d399;--gr:#fbbf24;--gg:#94a3b8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.45 "Nunito",ui-rounded,"SF Pro Rounded","Quicksand",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:480px;height:100%;height:100dvh;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden}
#main{flex:1 1 0;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:pan-y;padding:14px 14px 40px}
nav{display:flex;border-top:1px solid var(--bd);background:var(--card)}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:9px 0 8px;font:inherit;font-size:11px;cursor:pointer}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--ac);font-weight:600}
h2{margin:0;font-size:20px;font-weight:800}h3{margin:20px 0 8px 2px;font-size:15px;font-weight:700;color:var(--mu)}
.hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}

der APK heruntergeladen und installiert. Für Änderungen an der APK selbst (Berechtigungen, Symbol, Plugins) ist ein Neukompilieren nötig.", "Quando carichi un nuovo index.html nel tuo repository (pubblico), viene scaricato e installato qui senza ricompilare l'APK. Per le modifiche all'APK stesso (permessi, icona, plugin) bisogna ricompilare.", "Când încarci un index.html nou în depozitul tău (public), se descarcă și se instalează aici fără a recompila APK-ul. Pentru modificări ale APK-ului în sine (permisiuni, pictogramă, pluginuri) trebuie să recompilezi."], ["Cuándo avisar", "When to remind", "Quando lembrar", "Quand rappeler", "Wann erinnern", "Quando avvisare", "Când să avertizeze"], ["Datos", "Data", "Dados", "Données", "Daten", "Dati", "Date"], ["De lunes a viernes", "Monday to Friday", "De segunda a sexta", "Du lundi au vendredi", "Montag bis Freitag", "Dal lunedì al venerdì", "De luni până vineri"], ["Del calendario", "From the calendar", "Do calendário", "Du calendrier", "Aus dem Kalender", "Dal calendario", "Din calendar"], ["Denegado", "Denied", "Negada", "Refusée", "Abgelehnt", "Negato", "Refuzat"], ["Denegado: actívalo en los ajustes del móvil", "Denied: turn it on in your phone settings", "Negada: ative nas definições do telemóvel", "Refusée : activez-la dans les réglages du téléphone", "Abgelehnt: aktiviere es in den Handy-Einstellungen", "Negato: attivalo nelle impostazioni del telefono", "Refuzat: activează-l în setările telefonului"], ["Desactivado", "Off", "Desativado", "Désactivé", "Aus", "Disattivato", "Dezactivat"], ["Desactivados", "Off", "Desativados", "Désactivés", "Aus", "Disattivati", "Dezactivate"], ["Descanso", "Break", "Pausa", "Pause", "Pause", "Pausa", "Pauză"], ["Descanso pagado", "Paid break", "Pausa paga", "Pause payée", "Bezahlte Pause", "Pausa pagata", "Pauză plătită"], ["Descanso pagado por defecto", "Paid break by default", "Pausa paga por defeito", "Pause payée par défaut", "Bezahlte Pause als Standard", "Pausa pagata per impo a con ella, sin recompilar el APK y sin perder tus datos. Si algo fallara al arrancar, la app vuelve sola a la versión del APK.", "In Settings → Updates enter your repository (user/name, public) and tap Check for updates. If there is a new version, it is downloaded and the app restarts with it, without rebuilding the APK and without losing your data. If anything fails on start-up, the app goes back to the APK version on its own.", "Em Definições → Atualizações escreva o seu repositório (utilizador/nome, público) e toque em Procurar atualização. Se houver uma versão nova, é descarregada e a app reinicia com ela, sem recompilar o APK e sem perder os seus dados. Se algo falhar no arranque, a app volta sozinha à versão do APK.", "Dans Réglages → Mises à jour, saisissez votre dépôt (utilisateur/nom, public) et touchez Rechercher une mise à jour. S'il y a une nouvelle version, elle est téléchargée et l'app redémarre avec elle, sans recompiler l'APK et sans perdre vos données. Si quelque chose échoue au démarrage, l'app revient seule à la version de l'APK.", "Gib unter Einstellungen → Updates dein Repository ein (Nutzer/Name, öffentlich) und tippe auf Nach Update suchen. Gibt es eine neue Version, wird sie heruntergeladen und die App startet damit neu – ohne die APK neu zu kompilieren und ohne Datenverlust. Schlägt beim Start etwas fehl, wechselt die App von selbst zur APK-Version zurück.", "In Impostazioni → Aggiornamenti scrivi il tuo repository (utente/nome, pubblico) e tocca Cerca aggiornamenti. Se c'è una nuova versione, viene scaricata e l'app si riavvia con essa, senza ricompilare l'APK e senza perdere i tuoi dati. Se qualcosa non va all'avvio, l'app torna da sola alla versione dell'APK.", "În Setări → Actualizări scrie depozitul tău (utilizator/nume, public) și apasă Caută actualizări. Dacă există o versiune nouă, se descarcă, iar aplicația repornește cu ea, fără a recompila APK-ul și fără a-ți pierde datele. Dacă ceva nu merge la pornire, aplicația revine singură la versiunea din APK."], ["En Ajustes → Avisos activa el interruptor y concede el permiso cuando el móvil lo pida. Puedes elegir cuánto antes avisar de la entrada, la salida y el descanso, avisar de los festivos y personalizar cada mensaje.", "In Settings → Reminders turn on the switch and grant the permission when your phone asks. You can choose how long before to be reminded of start, end and break, get holiday reminders, and customise every message.", "Em Definições → Lembretes ative o interruptor e conceda a permissão quando o telemóvel pedir. Pode escolher quanto tempo antes o avisar da entrada, da saída e da pausa, ser avisado dos feriados e personalizar cada mensagem.", "Dans Réglages → Rappels, activez l'interrupteur et accordez l'autorisation quand le téléphone la demande. Vous pouvez choisir combien de temps avant être prévenu de l'arrivée, du départ et de la pause, être prévenu des jours fériés et personnaliser chaque message.", "Aktiviere unter Einstellungen → Erinnerungen den Schalter und erteile die Berechtigung, wenn dein Handy danach fragt. Du kannst wählen, wie lange vorher du an Beginn, Ende und Pause erinnert wirst, Feiertage melden lassen und jede Nachricht anpassen.", "In Impostazioni → Promemoria attiva l'interruttore e concedi il permesso quando il telefono lo chiede. Puoi scegliere quanto prima avvisare di inizio, fine e pausa, ricevere avvisi sulle festività e personalizzare ogni messaggio.", "În Setări → Notificări activează comutatorul și acordă permisiunea când telefonul o cere. Poți alege cu cât timp înainte să fii avertizat de intrare, ieșire și pauză, să primești avertizări pentru sărbători și să personalizezi fiecare mesaj."], ["En Ajustes → Festivos de Google Calendar elige tu país (o pega el enlace iCal de tu propio calendario), el año y pulsa Buscar festivos. Marca los que quieras y pulsa Añadir: salen en el calendario como Festivo, con su nombre y sus avisos. Necesita internet solo en ese momento.", "In Settings → Google Calendar holidays choose your country (or paste the iCal link of your own calendar), the year, and tap Find holidays. Tick the ones you want and tap Add: they appear in the calendar as Holiday, with their name and reminders. Internet is needed only at that moment.", "Em Definições → Feriados do Google Calendar escolha o seu país (ou cole o link iCal do seu próprio calendário), o ano e toque em Procurar feriados. Marque os que quiser e toque em Adicionar: aparecem no calendário como Feriado, com o seu nome e lembretes. Só precisa de internet nesse momento.", "Dans Réglages → Jours fériés Google Agenda, choisissez votre pays (ou collez le lien iCal de votre propre agenda), l'année et touchez Chercher les jours fériés. Cochez ceux que vous voulez et touchez Ajouter : ils apparaissent dans le calendrier comme Jour férié, avec leur nom et leurs rappels. Internet n'est nécessaire qu'à ce moment-là.", "Wähle unter Einstellungen → Feiertage aus Google Kalender dein Land (oder füge den iCal-Link deines eigenen Kalenders ein) und das Jahr und tippe auf Feiertage suchen. Hake die gewünschten an und tippe auf Hinzufügen: Sie erscheinen im Kalender als Feiertag, mit Namen und Erinnerungen. Internet wird nur in diesem Moment benötigt.", "In Impostazioni → Festività di Google Calendar scegli il tuo paese (o incolla il link iCal del tuo calendario), l'anno e tocca Cerca festività. Seleziona quelle che vuoi e tocca Aggiungi: appaiono nel calendario come Festività, con il loro nome e i promemoria. Internet serve solo in quel momento.", "În Setări → Sărbători Google Calendar alege țara (sau lipește linkul iCal al propriului calendar), anul și apasă Caută sărbători. Bifează-le pe cele dorite și apasă Adaugă: apar în calendar ca Sărbătoare, cu numele și notificările lor. Ai nevoie de internet doar în acel moment."], ["En Ajustes → Horario fijo la app rellena sola tus turnos. Elige \"Todos igual\" para un único horario en los días que marques, o \"Uno a uno\" para uno distinto por día. Indica entrada, salida y descanso, y si el descanso es pagado o no: las horas se calculan solas. Los días automáticos tienen borde discontinuo y puedes cambiarlos tocándolos.", "In Settings → Fixed schedule the app fills in your shifts automatically. Choose \"Same for all\" for a single schedule on the days you mark, or \"One by one\" for a different one per day. Set start, end and break, and whether the break is paid: the hours are calculated automatically. Automatic days have a dashed border and you can change them by tapping them.", "Em Definições → Horário fixo a app preenche os seus turnos sozinha. Escolha \"Todos iguais\" para um único horário nos dias que marcar, ou \"Um a um\" para um diferente por dia. Indique entrada, saída e pausa, e se a pausa é paga ou não: as horas são calculadas automaticamente. Os dias automáticos têm borda tracejada e pode alterá-los tocando neles.", "Dans Réglages → Horaire fixe, l'app remplit seule vos horaires. Choisissez « Tous pareil » pour un horaire unique les jours que vous cochez, ou « Un par un » pour un horaire différent par jour. Indiquez début, fin et pause, et si la pause est payée ou non : les heures se calculent automatiquement. Les jours automatiques ont une bordure en pointillés et vous pouvez les modifier en les touchant.", "Unter Einstellungen → Fester Dienstplan füllt die App deine Schichten automatisch aus. Wähle „Alle gleich“ für einen einzigen Dienstplan an den markierten Tagen oder „Einzeln“ für einen anderen pro Tag. Gib Beginn, Ende und Pause an und ob die Pause bezahlt ist: Die Stunden werden automatisch berechnet. Automatische Tage haben einen gestrichelten Rand und lassen sich durch Antippen ändern.", "In Impostazioni → Orario fisso l'app compila da sola i tuoi turni. Scegli \"Tutti uguali\" per un unico orario nei giorni che segni, oppure \"Uno a uno\" per uno diverso ogni giorno. Indica inizio, fine e pausa, e se la pausa è pagata o no: le ore si calcolano da sole. I giorni automatici hanno il bordo tratteggiato e puoi modificarli toccandoli.", "În Setări → Program fix aplicația îți completează singură turele. Alege „Toate la fel” pentru un singur program în zilele pe care le marchezi sau „Una câte una” pentru unul diferit pe zi. Indică intrarea, ieșirea și pauza și dacă pauza este plătită sau nu: orele se calculează automat. Zilele automate au bordură punctată și le poți schimba atingându-le."], ["En Ajustes → Personalizar eliges el tema (claro, oscuro o automático), el color principal, el tamaño del texto, el primer día de la semana, la moneda y qué secciones ves en el calendario.", "In Settings → Customize you choose the theme (light, dark or automatic), the main colour, the text size, the first day of the week, the currency and the language, and which sections you see in the calendar.", "Em Definições → Personalizar escolhe o tema (claro, escuro ou automático), a cor principal, o tamanho do texto, o primeiro dia da semana, a moeda e o idioma, e que secções vê no calendário.", "Dans Réglages → Personnaliser, vous choisissez le thème (clair, sombre ou automatique), la couleur principale, la taille du texte, le premier jour de la semaine, la devise et la langue, et les sections visibles dans le calendrier.", "Unter Einstellungen → Anpassen wählst du das Design (hell, dunkel oder automatisch), die Hauptfarbe, die Textgröße, den ersten Wochentag, die Währung und die Sprache sowie die Abschnitte, die du im Kalender siehst.", "In Impostazioni → Personalizza scegli il tema (chiaro, scuro o automatico), il colore principale, la dimensione del testo, il primo giorno della settimana, la valuta e la lingua, e quali sezioni vedere nel calendario.", "În Setări → Personalizare alegi tema (deschisă, închisă sau automată), culoarea principală, dimensiunea textului, prima zi a săptămânii, moneda, limba și ce secțiuni vezi în calendar."], ["En Ajustes → Reparto del sueldo creas porciones con una cantidad cada una (vivienda, comida, ahorro…). Puedes repartir lo que cobras según el calendario o un importe fijo al mes. En Resumen verás cuánto llevas gastado de cada porción.", "In Settings → Salary split you create portions with an amount each (housing, food, savings…). You can split what you earn according to the calendar or a fixed monthly amount. In Summary you will see how much you have spent from each portion.", "Em Definições → Divisão do salário cria partes com um valor cada (habitação, alimentação, poupança…). Pode repartir o que recebe segundo o calendário ou um valor fixo por mês. Em Resumo vê quanto já gastou de cada parte.", "Dans Réglages → Répartition du salaire, vous créez des parts avec un montant chacune (logement, alimentation, épargne…). Vous pouvez répartir ce que vous gagnez selon le calendrier ou un montant fixe par mois. Dans Résumé, vous voyez combien vous avez dépensé de chaque part.", "Unter Einstellungen → Gehaltsaufteilung legst du Anteile mit je einem Betrag an (Wohnen, Essen, Sparen…). Du kannst aufteilen, was du verdienst – nach Kalender oder mit einem festen Monatsbetrag. In der Übersicht siehst du, wie viel du von jedem Anteil ausgegeben hast.", "In Impostazioni → Ripartizione dello stipendio crei quote con un importo ciascuna (casa, cibo, risparmio…). Puoi ripartire quanto guadagni in base al calendario o a un importo fisso al mese. In Riepilogo vedi quanto hai speso per ogni quota.", "În Setări → Împărțirea salariului creezi porții cu o sumă fiecare (locuință, mâncare, economii…). Poți împărți ce încasezi după calendar sau după o sumă fixă pe lună. În Rezumat vei vedea cât ai cheltuit din fiecare porție."], ["En Calendario toca un día, elige el tipo de jornada (mañana, tarde, noche, vacaciones…), ajusta las horas, añade horas extra o una nota y pulsa Guardar. Para quitarlo, toca el día y pulsa Quitar.", "In Calendar tap a day, choose the type of day (morning, afternoon, night, vacation…), adjust the hours, add overtime or a note and tap Save. To clear it, tap the day and tap Remove.", "Em Calendário toque num dia, escolha o tipo de jornada (manhã, tarde, noite, férias…), ajuste as horas, adicione horas extra ou uma nota e toque em Guardar. Para o remover, toque no dia e toque em Remover.", "Dans Calendrier, touchez un jour, choisissez le type de journée (matin, après-midi, nuit, congés…), ajustez les heures, ajoutez des heures sup. ou une note et touchez Enregistrer. Pour l'effacer, touchez le jour puis Retirer.", "Tippe im Kalender auf einen Tag, wähle die Art des Tages (Früh, Spät, Nacht, Urlaub…), passe die Stunden an, füge Überstunden oder eine Notiz hinzu und tippe auf Speichern. Zum Entfernen tippe auf den Tag und dann auf Entfernen.", "In Calendario tocca un giorno, scegli il tipo di giornata (mattina, pomeriggio, notte, ferie…), regola le ore, aggiungi straordinari o una nota e tocca Salva. Per rimuoverlo, tocca il giorno e poi Rimuovi.", "În Calendar atinge o zi, alege tipul de zi (dimineață, după-amiază, noapte, concediu…), ajustează orele, adaugă ore suplimentare sau o notă și apasă Salvează. Pentru a o șterge, atinge ziua și apasă Elimină."], ["En Finanzas pulsa el botón + , escribe el importe y elige la porción. El gasto se resta de \"Te quedan este mes\". También puedes crear pagos que se repiten.", "In Finance tap the + button, type the amount and choose the portion. The expense is deducted from \"You have left this month\". You can also create recurring payments.", "Em Finanças toque no botão + , escreva o valor e escolha a parte. A despesa é descontada de \"Restam-lhe este mês\". Também pode criar pagamentos recorrentes.", "Dans Finances, touchez le bouton + , saisissez le montant et choisissez la part. La dépense est déduite de « Il vous reste ce mois-ci ». Vous pouvez aussi créer des paiements récurrents.", "Tippe in Finanzen auf die Schaltfläche + , gib den Betrag ein und wähle den Anteil. Die Ausgabe wird von „Dir bleiben diesen Monat“ abgezogen. Du kannst auch wiederkehrende Zahlungen anlegen.", "In Finanze tocca il pulsante + , scrivi l'importo e scegli la quota. La spesa viene sottratta da \"Ti restano questo mese\". Puoi anche creare pagamenti ricorrenti.", "În Finanțe apasă butonul +, scrie suma și alege porția. Cheltuiala se scade din „Îți mai rămân luna aceasta”. Poți crea și plăți care se repetă."], ["En Google Calendar: Configuración → tu calendario → \"Dirección secreta en formato iCal\". Se importan los eventos de día completo. El enlace solo se guarda en tu móvil.", "In Google Calendar: Settings → your calendar → \"Secret address in iCal format\". All-day events are imported. The link is only stored on your phone.", "No Google Calendar: Definições → o seu calendário → \"Endereço secreto em formato iCal\". Importam-se os eventos de dia inteiro. O link só é guardado no seu telemóvel.", "Dans Google Agenda : Paramètres → votre agenda → « Adresse secrète au format iCal ». Les événements sur toute la journée sont importés. Le lien n'est enregistré que sur votre téléphone.", "In Google Kalender: Einstellungen → dein Kalender → „Geheime Adresse im iCal-Format“. Ganztägige Termine werden importiert. Der Link wird nur auf deinem Handy gespeichert.", "In Google Calendar: Impostazioni → il tuo calendario → \"Indirizzo segreto in formato iCal\". Vengono importati gli eventi di tutto il giorno. Il link viene salvato solo sul tuo telefono.", "În Google Calendar: Setări → calendarul tău → „Adresă secretă în format iCal”. Se importă evenimentele de toată ziua. Linkul se păstrează doar pe telefonul tău."], ["En Xiaomi, Huawei, Oppo o Samsung quita el ahorro de batería: Ajustes del móvil → Aplicaciones → Mi Calendario → Batería → Sin restricciones.", "On Xiaomi, Huawei, Oppo or Samsung, remove battery saving: Phone settings → Apps → My Calendar → Battery → No restrictions.", "Em Xiaomi, Huawei, Oppo ou Samsung retire a poupança de bateria: Definições do telemóvel → Aplicações → O Meu Calendário → Bateria → Sem restrições.", "Sur Xiaomi, Huawei, Oppo ou Samsung, désactivez l'économie de batterie : Réglages du téléphone → Applications → Mon Calendrier → Batterie → Sans restriction.", "Bei Xiaomi, Huawei, Oppo oder Samsung den Akkusparmodus aufheben: Handy-Einstellungen → Apps → Mein Kalender → Akku → Keine Einschränkungen.", "Su Xiaomi, Huawei, Oppo o Samsung togli il risparmio energetico: Impostazioni del telefono → App → Il Mio Calendario → Batteria → Nessuna restrizione.", "Pe Xiaomi, Huawei, Oppo sau Samsung dezactivează economisirea bateriei: Setările telefonului → Aplicații → Calendarul meu → Baterie → Fără restricții."], ["En cada día, también en los libres, puedes sumar horas extra con − / +. Se pagan con la tarifa de entre semana o la de fin de semana/festivo, según el día. Las tarifas, el sueldo por horas o mensual y las vacaciones se cambian en Ajustes → Salario.", "On each day, including days off, you can add overtime with − / +. It is paid at the weekday rate or the weekend/holiday rate, depending on the day. Rates, hourly or monthly pay and vacation are changed in Settings → Salary.", "Em cada dia, também nos de folga, pode somar horas extra com − / +. São pagas com a tarifa de dia útil ou a de fim de semana/feriado, conforme o dia. As tarifas, o salário por hora ou mensal e as férias alteram-se em Definições → Salário.", "Chaque jour, y compris les jours de repos, vous pouvez ajouter des heures sup. avec − / +. Elles sont payées au tarif de semaine ou à celui du week-end/jour férié, selon le jour. Les tarifs, le salaire horaire ou mensuel et les congés se modifient dans Réglages → Salaire.", "An jedem Tag, auch an freien, kannst du Überstunden mit − / + hinzufügen. Sie werden mit dem Wochentags- oder dem Wochenend-/Feiertagssatz vergütet, je nach Tag. Sätze, Stunden- oder Monatsgehalt und Urlaub änderst du unter Einstellungen → Gehalt.", "In ogni giorno, anche in quelli liberi, puoi aggiungere straordinari con − / +. Vengono pagati con la tariffa feriale o con quella del fine settimana/festivo, secondo il giorno. Tariffe, stipendio orario o mensile e ferie si cambiano in   const t=(S.set.fixedT||{})[d]||{},st=t.in||c.start||'08:00',en=t.out||endOf(st,c.hours),br=Math.max(0,+t.br||0),brp=t.brp!==undefined?!!t.brp:!!S.set.brPaid;
  return{c,start:st,end:en,br,brp,hours:Math.round(durH(st,en,br,brp)*100)/100};
}
function rotBlock(k){const r=S.set.rot;if(!r||!r.blocks||!r.blocks.length)return null;
  const tot=r.blocks.reduce((a,b)=>a+Math.max(1,+b.n||1),0);
  let off=Math.round((new Date(k+'T00:00:00')-new Date((r.start||k)+'T00:00:00'))/864e5);off=((off%tot)+tot)%tot;
  for(const b of r.blocks){const n=Math.max(1,+b.n||1);if(off<n)return b;off-=n}return null}
function blockTimes(b){const c=b&&cat(b.cat);if(!c||c.kind!=='work')return null;
  const st=b.in||c.start||'08:00',en=b.out||endOf(st,c.hours),br=Math.max(0,+b.br||0),brp=b.brp!==undefined?!!b.brp:!!S.set.brPaid;
  return{c,start:st,end:en,br,brp,hours:Math.round(durH(st,en,br,brp)*100)/100}}
function fixedFor(k){
  if(S.set.fixedKind==='rot')return blockTimes(rotBlock(k));
  return fixedTimes(new Date(k+'T00:00:00').getDay())}
function autoDay(k){
  const a=autoCat(k);if(!a)return null;
  const f=fixedFor(k);if(!f)return null;
  return{cat:a,hours:f.hours,ot:0,auto:true,start:f.start,end:f.end,br:f.br,brp:f.brp};
}
function getDay(k){
  const e=S.days[k];if(e)return e;

function datesFor(prefix){
  const out=new Set(Object.keys(S.days).filter(k=>k.startsWith(prefix)));
  const add=(a,b)=>{for(let t=new Date(a+'T00:00:00');t<=b;t.setDate(t.getDate()+1))out.add(key(t.getFullYear(),t.getMonth(),t.getDate()))};
  if(prefix.length===7){const[y,m]=prefix.split('-').map(Number);add(`${prefix}-01`,new Date(y,m,0))}
  else if(prefix.length===4)add(`${prefix}-01-01`,new Date(+prefix,11,31));
  else if(S.set.fixedOn&&S.set.fixedFrom){const n=new Date();add(S.set.fixedFrom,new Date(n.getFullYear(),n.getMonth()+1,0))}
  return out;
}
function calc(prefix){
  const r={days:0,byCat:{},ordH:0,otWk:0,otWe:0,vacDays:0},ds=datesFor(prefix);
  for(const k of ds){
    const e=getDay(k),c=e&&cat(e.cat);
    if(!c){if(e&&e.ot>0){if(isWe(k,null))r.otWe+=e.ot;else r.otWk+=e.ot}continue}
    r.byCat[c.id]=(r.byCat[c.id]||0)+1;
    if(c.kind==='work'){r.days++;r.ordH+=e.hours}
    else if(['vacation','holiday','leave'].includes(c.kind))r.ordH+=e.hours;
    if(c.kind==='vacation')r.vacDays++;
    if(e.ot>0){if(isWe(k,c))r.otWe+=e.ot;else r.otWk+=e.ot}
  }
  const mon=S.set.mode==='mensual',nm=prefix.length===7?1:prefix.length===4?12:new Set([...ds].map(k=>k.slice(0,7))).size;
  r.base=mon?S.set.monthly*nm:r.ordH*S.set.rate;r.payWk=r.otWk*S.set.rateWk;r.payWe=r.otWe*S.set.rateWe;
  r.total=r.base+r.payWk+r.payWe;

}

function buildEvents(from,days){
  const n=S.set.notif,out=[],f=new Date(from.getFullYear(),from.getMonth(),from.getDate());
  const hm=t=>`${pad(t.getHours())}:${pad(t.getMinutes())}`;
  for(let i=0;i<days;i++){
    const d=new Date(f);d.setDate(f.getDate()+i);
    const k=key(d.getFullYear(),d.getMonth(),d.getDate()),e=getDay(k),c=e&&cat(e.cat);if(!c)continue;
    if(c.kind==='work'&&c.start){
      const stt=e.start||c.start,br=e.br||0,brp=e.brp!==undefined?!!e.brp:!!S.set.brPaid,st=new Date(`${k}T${stt}:00`),en=new Date(st.getTime()+((e.hours||c.hours||0)+(brp?0:br/60))*3600000);
      const fill=(m,t)=>m.replace(/\{turno\}/g,c.name).replace(/\{hora\}/g,hm(t)).replace(/\{descanso\}/g,br);
      if(n.brOn&&br>0){const bt=new Date(st.getTime()+(+n.brAfter||4)*3600000);if(bt<en)out.push({id:'b'+k,title:tr('Hora del descanso'),at:bt,body:fill(trx(n.brMsg||''),bt)})}
      if(n.inOn)out.push({id:'i'+k,title:tr('Hora de entrada'),at:new Date(st.getTime()-n.inMin*60000),body:fill(trx(n.inMsg),st)});
      if(n.outOn)out.push({id:'o'+k,title:tr('Hora de salida'),at:new Date(en.getTime()-n.outMin*60000),body:fill(trx(n.outMsg),en)});
    }
    if(c.kind==='holiday'&&n.holOn){
      const[h1,m1]=(n.holTime||'20:00').split(':').map(Number);
      const at=new Date(d.getFullYear(),d.getMonth(),d.getDate()-(n.holWhen==='before'?1:0),h1,m1);
      const nm=(e.note||'').trim()||c.name;
      out.push({id:'h'+k,title:tr('Día festivo'),at,body:trx(n.holMsg).replace(/\{cuando\}/g,(n.holWhen==='before'?tmr():tr('Hoy'))).replace(/\{nombre\}/g,nm)});
    }
  }
  return out;
}
function tick(){
  const n=S.set.notif;if(!n||!n.on)return;
  const now=Date.now(),f=S.fired=S.fired||{};let ch=false;
  buildEvents(new Date(now-86400000),3).forEach(ev=>{
    const t=ev.at.getTime(),id=ev.id+'@'+t;
    if(t<=now&&now-t<=120000&&!f[id]){f[id]=now;ch=true;fire(ev.title,ev.body)}
  });
  for(const k in f)if(now-f[k]>2*86400000){delete f[k];ch=true}
  if(ch)save();
}
async function syncNative(){
  const LN=native();if(!LN)return;
  try{
    const p=await LN.getPending();
    if(p&&p.notifications&&p.notifications.length)await LN.cancel({notifications:p.notifications});
    if(!S.set.notif.on||PERM!=='granted')return;
    const now=Date.now();
    const evs=buildEvents(new Date(),30).filter(e=>e.at.getTime()>now).sort((a,b)=>a.at-b.at).slice(0,120);
    if(evs.length)await LN.schedule({notifications:evs.map((e,i)=>({id:i+1,title:e.title,body:e.body,channelId:'avisos',schedule:{at:e.at,allowWhileIdle:true}}))});
  }catch(err){}
}

/* ---------- REPARTO DEL SUELDO ---------- */
const PAL=['#10b981','#f59e0b','#3b82f6','#ec4899','#6366f1','#14b8a6','#ef4444','#8b5cf6'];
const pc=n=>(Math.round(n*10)/10).toLocaleString(LOC);
function mBase(){const sp=S.set.split;return sp.src==='fix'?sp.fixed:calc(`${S.ym[0]}-${pad(S.ym[1]+1)}`).total}
function splitInfo(){const sp=S.set.split,tot=sp.items.reduce((a,x)=>a+(x.amt||0),0);return{sp,tot}}
function migAmt(){const sp=S.set.split;if(!sp.items.some(x=>x.amt===undefined))return;let b=mBase();if(!(b>0))b=sp.fixed>0?sp.fixed:1500;sp.items.forEach(x=>{if(x.amt===undefined){x.amt=Math.round(b*(x.pct||0)/100);delete x.pct}});save()}
function vSplit(r){
  const{sp,tot}=splitInfo(),fix=sp.src==='fix',k=S.per==='m'?1:12,base=(fix?sp.fixed*k:r.total)+S.fin.tx.filter(x=>x.inc&&x.d.startsWith(S.per==='m'?`${S.ym[0]}-${pad(S.ym[1]+1)}`:`${S.ym[0]}`)).reduce((a,x)=>a+x.a,0),T=tot*k,diff=Math.round((base-T)*100)/100;
  const[yy,mm]=S.ym,pre=S.per==='m'?`${yy}-${pad(mm+1)}`:`${yy}`,by={};
  S.fin.tx.filter(x=>x.d.startsWith(pre)&&!x.inc).forEach(x=>by[x.c]=(by[x.c]||0)+x.a);
  let gt=0;sp.items.forEach(x=>{if(!x.sv)gt+=by[x.id]||0});
  const un=Object.keys(by).filter(id=>!sp.items.some(x=>x.id===id)).reduce((a,id)=>a+by[id],0);gt+=un;
  let b=`<div class="row"><span>Para repartir <span class="mu">${fix?'importe fijo':'según tu calendario'}</span></span><b>${money(base)}</b></div>`;
  if(!sp.items.length)b+='<p class="mu" style="margin:6px 0">Aún no tienes porciones. Créalas en Ajustes → Reparto del sueldo.</p>';
  else{
    if(base<=0)b+='<p class="mu" style="margin:6px 0">Todavía no hay ingresos en este periodo. Marca días en el calendario o indica un importe fijo en Ajustes.</p>';
    const den=Math.max(base,T)||1;
    b+='<div class="bar">'+sp.items.map(x=>`<div style="width:${(x.amt||0)*k/den*100}%;background:${esc(x.color)}"></div>`).join('')+'</div>';
    b+='<div class="sg"><span></span><span class="h">Porcionado</span><span class="h">Gastado</span>'+sp.items.map(x=>{const g=by[x.id]||0,am=(x.amt||0)*k,over=!x.sv&&g>am+0.005;return `<span><span class="dot" style="--c:${esc(x.color)}"></span>${esc(x.name)}${x.sv?' '+I('piggy'):''}</span><b class="r">${money(am)}</b><span class="r" style="${over?'color:#e5484d;font-weight:700':''}">${x.sv?'ahorrado ':''}${money(g)}</span>`}).join('')+(un>0?`<span>Sin porción</span><b class="r">—</b><span class="r">${money(un)}</span>`:'')+`<span class="tt">Total</span><b class="r tt">${money(T)}</b><b class="r tt">${money(gt)}</b></div>`;
    if(Math.abs(diff)>0.005)b+=`<div class="row" style="border-top:1px solid var(--bd);margin-top:4px;padding-top:8px;${diff<0?'color:#e5484d':''}"><span>${diff>0?'Sin repartir':'Te pasas'}</span><b>${money(Math.abs(diff))}</b></div>`;
  }
  b+='<button class="btn g" style="width:100%;margin-top:10px" onclick="S.open=S.open||{};S.open.rep=true;go(\'set\')">Editar reparto</button>';
  return{s:sp.items.length?`${money(base)} · ${money(gt)} gastado`:'Sin porciones',b};
}
function splitSec(){
  const{sp,tot}=splitInfo(),fix=sp.src==='fix',mb=mBase(),diff=Math.round((mb-tot)*100)/100,ok=Math.abs(diff)<=0.005;
  let b=`<div class="seg"><button class="${fix?'':'on'}" onclick="sSet('src','cal')">Del calendario</button><button class="${fix?'on':''}" onclick="sSet('src','fix')">Importe fijo</button></div>`;
  b+=fix?srow('Lo que ganas al mes','Es la cantidad que se reparte cada mes',`<span class="nu"><input type="number" inputmode="decimal" step="0.01" min="0" value="${sp.fixed}" onchange="sSet('fixed',this.value)"><em>${esc(S.set.cur)}</em></span>`)
    :`<div class="sd" style="padding:2px 0 8px">Se reparte lo que calcula la app con tus días, tu sueldo y las horas extra (este mes: ${money(mb)}).</div>`;
  b+='<div class="sh">Porciones</div><div class="sd" style="margin:2px 0 10px">Cada porción es una categoría de gasto con su cantidad mensual como límite. Marca el icono de la hucha en las de ahorro: no cuentan como gasto.</div>'+sp.items.map((x,i)=>`<div class="pr"><button class="cdot" style="--c:${esc(x.color)}" onclick="pickColor('pr',${i},'${esc(x.color)}','Color de ${esc(x.name.replace(/['"\\\\]/g,''))}')" aria-label="Cambiar color"></button><input value="${esc(x.name)}" onchange="pSet(${i},'name',this.value)" aria-label="Nombre"><span class="nu"><input type="number" inputmode="decimal" step="1" min="0" value="${x.amt||0}" onchange="pSet(${i},'amt',this.value)" aria-label="Cantidad de ${esc(x.name)}"><em style="min-width:0">${esc(S.set.cur)}</em></span><button class="chip${x.sv?' on':''}" style="--c:#6366f1" onclick="pSv(${i})" aria-label="Es ahorro" title="Es ahorro">${I('piggy')}</button><button class="chip" onclick="pDel(${i})" aria-label="Quitar porción">${I('x')}</button></div>`).join('');
  b+=`<div class="row"><span>Total repartido</span><b>${money(tot)}</b></div><div class="row" style="${diff<-0.005?'color:#e5484d':''}"><span class="mu" style="${diff<-0.005?'color:inherit':''}">${ok?'Todo repartido':diff>0?'Sin repartir':'Te pasas'}</span>${ok?'':`<b>${money(Math.abs(diff))}</b>`}</div>`;
  if(!ok&&tot>0&&mb>0)b+='<button class="btn g" style="width:100%;margin-top:6px" onclick="pNorm()">Ajustar a tus ingresos</button>';
  b+='<button class="btn g" style="width:100%;margin-top:8px" onclick="pAdd()">Añadir porción</button>';
  return sec('rep','Reparto del sueldo',`${sp.items.length} porciones · ${money(tot)}`,b);
}
function sSet(k,v){S.set.split[k]=k==='fixed'?num(v):v;save();render()}
function pSet(i,k,v){S.set.split.items[i][k]=k==='amt'?Math.max(0,num(v)):(k==='name'?(v.trim()||'Sin nombre'):v);save();render()}
function pAdd(){const it=S.set.split.items;it.push({id:'p'+Date.now(),name:'Nueva porción',color:PAL[it.length%PAL.length],amt:0,sv:false});save();render()}
function pDel(i){S.set.split.items.splice(i,1);save();render()}
function pNorm(){const it=S.set.split.items,t=it.reduce((a,x)=>a+(x.amt||0),0),b=mBase();if(!(t>0&&b>0))return;it.forEach(x=>x.amt=Math.round((x.amt||0)/t*b*100)/100);const d=Math.round((b-it.reduce((a,x)=>a+x.amt,0))*100)/100,l=it[it.length-1];l.amt=Math.max(0,Math.round((l.amt+d)*100)/100);save();render()}
/* ---------- FINANZAS ---------- */
const fiso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fdt=s=>new Date(s+'T12:00:00');
const fid=()=>'x'+Math.random().toString(36).slice(2,9);
const faddP=(s,f)=>{const d=fdt(s);if(f==='w')d.setDate(d.getDate()+7);else if(f==='y')d.setFullYear(d.getFullYear()+1);else d.setMonth(d.getMonth()+1);return fiso(d)};
const fym=()=>`${S.ym[0]}-${pad(S.ym[1]+1)}`;
const fcat=id=>S.set.split.items.find(x=>x.id===id);
const fc=id=>fcat(id)||{id,name:'Sin categoría',color:'#7c8c88',amt:0};
const fmt=p=>S.fin.tx.filter(x=>x.d.startsWith(p));
let FA,flast,fuo=false;
function fsum(p){
  const items=S.set.split.items,sp0=S.set.split,base=sp0.src==='fix'?sp0.fixed:calc(p).total,tx=fmt(p),by={},ex=tx.reduce((a,x)=>a+(x.inc?x.a:0),0);
  tx.forEach(x=>{if(!x.inc)by[x.c]=(by[x.c]||0)+x.a});
  let B=0,sp=0,sv=0,svT=0;
  items.forEach(c=>{const l=c.amt||0;if(c.sv){svT+=l;sv+=by[c.id]||0}else{B+=l;sp+=by[c.id]||0}});
  Object.keys(by).forEach(k=>{if(!fcat(k))sp+=by[k]});
  return{base:base+ex,tx,by,B:B+ex,ex,sp,sv,svT};
}
function fproc(){const td=fiso(new Date());S.fin.rec.forEach(r=>{let g=0;while(r.next<=td&&g++<60){S.fin.tx.push({id:fid(),d:r.next,c:r.c,a:r.a,note:r.note,rec:r.id,inc:r.inc});r.next=faddP(r.next,r.f)}});save()}
function fsnack(m,u){const t=$('#ft');t.innerHTML=esc(m)+(u?'<button onclick="fUndo()">Deshacer</button>':'');t.classList.add('on');clearTimeout(fsnack.h);fsnack.h=setTimeout(()=>t.classList.remove('on'),3500)}
function fUndo(){if(flast){S.fin.tx.push(flast);flast=null;save();render();$('#ft').classList.remove('on')}}
function fRm(id){const i=S.fin.tx.findIndex(x=>x.id===id);if(i>=0){flast=S.fin.tx.splice(i,1)[0];save();render();fsnack(flast.inc?'Ingreso eliminado':'Gasto eliminado',1)}}
function fRr(id){S.fin.rec=S.fin.rec.filter(r=>r.id!==id);save();render();fsnack('Pago recurrente cancelado')}
function ftxr(x,del){const inc=!!x.inc,c=inc?{name:'Ingreso',color:'#10b981'}:fc(x.c);return `<div class="ftx"><span class="dot" style="--c:${esc(c.color)};margin:0"></span><div class="t"><b${x.note?' data-nt':''}>${esc(x.note)||(inc?'Ingreso extra':esc(c.name))}</b><span class="mu">${esc(c.name)} · ${fdt(x.d).toLocaleDateString(LOC,{day:'numeric',month:'short'})}${x.rec?' · recurrente':''}</span></div><b${inc?' style="color:#10b981"':''}>${inc?'+':'−'}${money(x.a)}</b>${del?`<button class="chip" onclick="fRm('${x.id}')" aria-label="Eliminar">${I('x')}</button>`:''}</div>`}
function fDonut(o){
  const tot=Object.values(o).reduce((a,b)=>a+b,0);if(!tot)return '<div class="mu" style="text-align:center;padding:16px 0">Aún no hay gastos este mes.</div>';
  let acc=0;const r=40,Cc=2*Math.PI*r,ents=Object.entries(o).sort((a,b)=>b[1]-a[1]);
  const arcs=ents.map(([k,v])=>{const l=v/tot*Cc,s=`<circle cx="50" cy="50" r="${r}" fill="none" stroke="${esc(fc(k).color)}" stroke-width="16" stroke-dasharray="${l} ${Cc-l}" stroke-dashoffset="${-acc}" transform="rotate(-90 50 50)"/>`;acc+=l;return s}).join('');
  return `<div style="display:flex;align-items:center;gap:10px"><svg viewBox="0 0 100 100" width="130" height="130" role="img" aria-label="Gastos por categoría">${arcs}<text x="50" y="53" text-anchor="middle" font-size="11" font-weight="800" fill="currentColor">${esc(curA(Math.round(tot)))}</text></svg><div style="flex:1">${ents.map(([k,v])=>`<div class="row" style="padding:2px 0;font-size:14px"><span><span class="dot" style="--c:${esc(fc(k).color)}"></span>${esc(fc(k).name)}</span><b>${Math.round(v/tot*100)}%</b></div>`).join('')}</div></div>`;
}
function vFin(){
  const sub=S.fsub||'mes';
  return hdr()+`<div class="seg">${[['mes','Mes'],['mov','Movimientos'],['lim','Límites']].map(([k,n])=>`<button class="${sub===k?'on':''}" onclick="S.fsub='${k}';save();render()">${n}</button>`).join('')}</div>`+({mes:fMes,mov:fMov,lim:fLim})[sub]();
}
function fMes(){
  const p=fym(),r=fsum(p),n=new Date(),[y,m]=S.ym,dim=new Date(y,m+1,0).getDate(),cur=n.getFullYear()===y&&n.getMonth()===m,past=new Date(y,m,1)<new Date(n.getFullYear(),n.getMonth(),1);
  const left=r.B-r.sp,pace=cur?n.getDate()/dim:past?1:0,dl=cur?dim-n.getDate()+1:0,al=S.set.fin.al/100;
  const fill=r.B?Math.min(r.sp/r.B,1):(r.sp?1:0),delta=r.sp-r.B*pace,bc=left<0?'#f87171':(cur&&delta>r.B*0.05)?'#fbbf24':'#4ade80';
  let st;
  if(r.B<=0)st={e:'info',t:'Reparte tu sueldo en porciones para ver cuánto puedes gastar'};
  else if(left<0)st={e:'alert',t:`Te has pasado ${money(-left)} del límite del mes`};
  else if(past)st={e:'ok',t:`Mes cerrado: gastaste ${money(r.sp)} ${DE()} ${money(r.B)}`};
  else if(!cur)st={e:'calendar',t:'Este mes todavía no ha empezado'};
  else if(delta>r.B*0.05)st={e:'alert',t:`Vas ${money(delta)} por encima del ritmo previsto`};
  else st={e:'ok',t:delta<0?`Vas bien: llevas ${money(-delta)} menos de lo previsto`:'Vas al ritmo previsto'};
  const tile=(a,b,c)=>`<div><span class="fl">${a}</span><b>${b}</b><span class="fl">${c}</span></div>`;
  let h='';
  if(r.base<=0)h+='<div class="card"><b>Aún no hay ingresos que repartir</b><div class="mu">Marca tus días en el calendario o indica un importe fijo en Ajustes → Reparto del sueldo.</div></div>';
  const last=[...r.tx].sort((a,b)=>b.d.localeCompare(a.d)).slice(0,5);
  h+=`<section class="fhero"><div class="fl">Te quedan para gastar este mes</div><div class="big">${money(left)}</div><div class="fst">${I(st.e)} ${st.t}</div>${r.ex>0?`<div class="fst" style="margin-top:2px">Incluye <span data-nt>+${money(r.ex)}</span> de ingresos extra</div>`:''}
  <div class="fbw">${cur?`<div class="fbh"><span style="left:${Math.min(Math.max(pace*100,13),87)}%">Hoy · día ${n.getDate()}</span></div>`:''}<div class="fbx"><div class="fbt">${cur?`<u style="width:${pace*100}%"></u>`:''}<i style="width:${fill*100}%;background:${bc}"></i></div>${cur?`<b class="ftick" style="left:${pace*100}%"></b>`:''}</div><div class="fbl"><span>0</span><span>Límite ${money(r.B)}</span></div>${cur?`<div class="fbk"><span><s style="background:${bc}"></s>Gastado</span><span><s class="pv"></s>Previsto hasta hoy · ${money(r.B*pace)}</span></div>`:''}</div>
  <div class="fti">${tile('Gastado',money(r.sp),'de '+money(r.B))}${tile('Al día',cur&&left>0?money(left/dl):'—','puedes gastar')}${tile('Días',cur?dl:'—','hasta fin de mes')}</div>
  ${r.svT>0?`<div class="fsv"><div class="row fl" style="font-size:13px"><span>${I('piggy')} Ahorro del mes</span><span>${money(r.sv)} ${DE()} ${money(r.svT)}</span></div><div class="fb"><i style="width:${Math.min(r.sv/r.svT,1)*100}%;background:var(--acx)"></i></div></div>`:''}
  <details class="fdd"${fuo?' open':''} ontoggle="fuo=this.open"><summary>Últimas transacciones</summary><div class="card">${last.length?last.map(x=>ftxr(x)).join(''):'<div class="mu" style="text-align:center;padding:14px 0">Registra tu primer gasto con el botón +.</div>'}</div></details></section>`;
  S.set.split.items.forEach(c=>{if(c.sv)return;const lim=c.amt||0,sp=r.by[c.id]||0;if(lim>0&&sp/lim>=al){const q=Math.round(sp/lim*100);h+=`<div class="fal${q>=100?' r':''}">${I('alert')} ${esc(c.name)} al ${q} % del límite</div>`}});
  if(cur)S.fin.rec.filter(x=>!x.inc).forEach(x=>{const d=Math.round((fdt(x.next)-fdt(fiso(n)))/864e5);if(d>=0&&d<=S.set.fin.rd)h+=`<div class="fal">${I('bell')} <span data-nt>${esc(x.note)}</span> se cobra ${d===0?'hoy':d===1?'mañana':'en '+d+' días'} (${money(x.a)})</div>`});
  return h+`<h3>Gastos por categoría</h3><div class="card">${fDonut(r.by)}</div>`;
}

function fLim(){

  <div style="display:flex;gap:8px;margin-top:12px"><button class="btn g" style="flex:1" onclick="closeSheet()">Cerrar</button><button class="btn g" style="flex:1.2" onclick="bkCopy()">Copiar texto</button><button class="btn" style="flex:1.4" onclick="bkShare()">Descargar archivo</button></div>`);
  $('#bkt').value=z?BKZ:BKF}
function bkMark(){S.set.lastBk=new Date().toISOString();save();if($('#main'))render()}
const bkName=()=>'copia-mi-calendario-'+new Date().toISOString().slice(0,10)+'.json';
async function bkCopy(){const t=$('#bkt').value;let ok=false;
  try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(t);ok=true}}catch(e){}
  if(!ok){try{const a=$('#bkt');a.focus();a.select();ok=document.execCommand('copy')}catch(e){}}
  if(ok)bkMark();
  toast(ok?'Copia hecha':'No se pudo copiar',ok?'Pégala en un sitio seguro':'Mantén pulsado el texto, elige Seleccionar todo y Copiar',ok?'info':'alert')}
async function bkShare(){const t=BKF;
  try{const P=(typeof Capacitor!=='undefined'&&Capacitor.Plugins)||{};
    if(P.Filesystem&&P.Share){const w=await P.Filesystem.writeFile({path:bkName(),data:t,directory:'CACHE',encoding:'utf8'});await P.Share.share({title:tr('Copia de Mi Calendario'),files:[w.uri],dialogTitle:'Guardar copia en…'});bkMark();return}
    if(navigator.share){const fl=new File([t],bkName(),{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[fl]}))await navigator.share({files:[fl],title:tr('Copia de Mi Calendario')});else await navigator.share({title:tr('Copia de Mi Calendario'),text:t});bkMark();return}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'application/json'}));a.download=bkName();document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);bkMark();toast('Archivo creado','Búscalo en Descargas','info')}
  catch(e){if(e&&(e.name==='AbortError'||/cancel/i.test(e.message||'')))return;toast('No se pudo compartir','Usa Copiar texto y pega el texto en Notas','alert')}}
function bkAsk(){
  holSheet(`<h2>Restaurar copia</h2><p class="mu">Pega aquí el texto de tu copia de seguridad o elige el archivo. <b>Se reemplazarán los datos que tienes ahora</b> (antes se guarda una copia por si te arrepientes).</p>
  <textarea id="bkr" placeholder="Pega aquí la copia…" style="${BKS}"></textarea>
  <input type="file" id="bkf" accept=".json,.txt,application/json,text/plain" style="display:none" onchange="bkFile(this)">
  <div style="display:flex;gap:8px;margin-top:12px"><button class="btn g" style="flex:1" onclick="closeSheet()">Cancelar</button><button class="btn g" style="flex:1" onclick="$('#bkf').click()">Archivo</button><button class="btn" style="flex:1.4" onclick="bkGo()">Restaurar</button></div>`)}
function bkFile(i){const f=i.files&&i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#bkr').value=String(r.result||'')};r.readAsText(f)}
async function bkParse(t){let o;t=String(t).trim();try{if(/^WCAL1:/.test(t))t=await bkUnpack(t);o=JSON.parse(t)}catch(e){return null}
  const d=o&&o.app==='wcal'&&o.data?o.data:o;
  return d&&typeof d==='object'&&d.days&&typeof d.days==='object'&&Array.isArray(d.cats)&&d.set&&typeof d.set==='object'?{d,when:o.date||''}:null}
async function bkGo(){const r=await bkParse($('#bkr')?$('#bkr').value:'');
  if(!r){toast('Copia no válida','Pega el texto completo de la copia de seguridad','alert');return}
  bkApply(r.d,r.when)}

/* ---------- SELECTOR DE HORA PROPIO ---------- */
let TPI=null,TPH=0,TPM=0;
const tp2=n=>String(n).padStart(2,'0');
function tpOpen(inp){TPI=inp;const v=String(inp.value||'08:00').split(':').map(Number);TPH=(v[0]||0)%24;TPM=(v[1]||0)%60;
  let ov=$('#tpo');if(!ov){ov=document.createElement('div');ov.id='tpo';ov.onclick=e=>{if(e.target===ov)tpClose()};$('#app').appendChild(ov)}
  clearTimeout(ov._t);ov.classList.remove('leave');ov.classList.add('on','enter');tpDraw();ov._t=setTimeout(()=>ov.classList.remove('enter'),320)}
function tpClose(){const ov=$('#tpo');TPI=null;if(!ov)return;
  if(!animOn()){ov.classList.remove('on','enter','leave');ov.innerHTML='';return}
  clearTimeout(ov._t);ov.classList.remove('enter');ov.classList.add('leave');ov._t=setTimeout(()=>{ov.classList.remove('on','leave');ov.innerHTML=''},210)}
function tpDraw(){const ov=$('#tpo');if(!ov||!TPI)return;
  const lb=TPI.closest('label'),t=lb&&lb.firstChild&&lb.firstChild.textContent.trim()||(TPI.previousElementSibling&&TPI.previousElementSibling.textContent.trim())||'Hora';
  ov.innerHTML=`<div class="tpp"><div class="tpt">${esc(t)}</div><div class="tpd">${tp2(TPH)}<i>:</i>${tp2(TPM)}</div>
  <div class="tpc"><div><small>Horas</small><div class="otw mini"><button class="btn g" onclick="tpStep('h',-1)" aria-label="Menos">${I('minus')}</button><input type="number" inputmode="numeric" min="0" max="23" value="${TPH}" onchange="tpSet('h',this.value)"><button class="btn g" onclick="tpStep('h',1)" aria-label="Más">${I('plus')}</button></div></div>
  <div><small>Minutos</small><div class="otw mini"><button class="btn g" onclick="tpStep('m',-5)" aria-label="Menos">${I('minus')}</button><input type="number" inputmode="numeric" min="0" max="59" value="${TPM}" onchange="tpSet('m',this.value)"><button class="btn g" onclick="tpStep('m',5)" aria-label="Más">${I('plus')}</button></div></div></div>
  <div class="tpq">${[0,15,30,45].map(m=>`<button class="btn g${TPM===m?' on':''}" onclick="tpSet('m',${m})">:${tp2(m)}</button>`).join('')}</div>
  <div class="tpb"><button class="btn g" onclick="tpClose()">Cancelar</button><button class="btn" onclick="tpOk()">Aceptar</button></div></div>`}
function tpStep(k,d){if(k==='h')TPH=(TPH+d+24)%24;else{TPM=TPM+d;if(TPM>=60){TPM-=60;TPH=(TPH+1)%24}else if(TPM<0){TPM+=60;TPH=(TPH+23)%24}}hap();tpDraw()}
function tpSet(k,v){v=Math.round(num(v));if(k==='h')TPH=Math.max(0,Math.min(23,v));else TPM=Math.max(0,Math.min(59,v));tpDraw()}
function tpOk(){const i=TPI;if(i){i.value=tp2(TPH)+':'+tp2(TPM);i.dispatchEvent(new Event('change',{bubbles:true}))}tpClose()}
(function(){const T=e=>e.target&&e.target.closest&&e.target.closest('input[type=time]');
  const stop=e=>{const i=T(e);if(i){i.readOnly=true;e.preventDefault()}};
  document.addEventListener('pointerdown',stop,true);document.addEventListener('mousedown',stop,true);document.addEventListener('touchstart',e=>{const i=T(e);if(i)i.readOnly=true},{capture:true,passive:true});
  document.addEventListener('click',e=>{const i=T(e);if(i){e.preventDefault();e.stopPropagation();i.blur();tpOpen(i)}},true);
  document.addEventListener('focusin',e=>{const i=T(e);if(i){i.readOnly=true;i.blur()}},true)})();
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(TPI)tpClose();else if($('#ov').classList.contains('on'))closeSheet()}});

setInterval(tick,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){onResume();bkAutoRun()}});tick();
try{const AP=typeof Capacitor!=='undefined'&&Capacitor.Plugins&&Capacitor.Plugins.App;if(AP&&AP.addListener)AP.addListener('resume',onResume)}catch(e){}
try{const LN0=native();if(LN0&&LN0.addListener)LN0.addListener('localNotificationActionPerformed',e=>{try{const x=e&&e.notification&&e.notification.extra;if(x&&x.go==='upd'){S.open={upd:true};go('set');updGo()}}catch(_){}})}catch(e){}

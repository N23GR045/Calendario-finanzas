@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

body{transition:background-color .3s,color .3s}

<body>
<div id="app">
  <div id="main"></div>
  <nav>
    <button data-v="cal" onclick="go('cal')"><span>📅</span>Calendario</button>
    <button data-v="fin" onclick="go('fin')"><span>💳</span>Finanzas</button>
    <button data-v="sum" onclick="go('sum')"><span>📊</span>Resumen</button>
    <button data-v="set" onclick="go('set')"><span>⚙️</span>Ajustes</button>
  </nav>
  <button class="fab" id="fab" onclick="fAdd()" aria-label="Añadir gasto">+</button>
  <div id="ft"></div>
  <div id="ov" onclick="if(event.target===this)closeSheet()"><div id="sheet"></div></div>
</div>
<script>
const MES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const KIND={work:'Trabajo',vacation:'Vacaciones',holiday:'Festivo',leave:'Baja/permiso',other:'Otro (sin pago)'};
const KEY='wcal_v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)&&n>=0?n:0};
let S,E=null,T,PERM='default';

function defaults(){
  const t=new Date(),y=t.getFullYear(),m=t.getMonth(),days={};
  const k=d=>`${y}-${pad(m+1)}-${pad(d)}`;
  for(let d=1;d<=Math.min(t.getDate(),new Date(y,m+1,0).getDate());d++){
    const w=new Date(y,m,d).getDay();
    if(w>=1&&w<=2)days[k(d)]={cat:'m',hours:8,ot:d===6?2:0};
    else if(w>=3&&w<=4)days[k(d)]={cat:'t',hours:8,ot:0};
    else if(w===5)days[k(d)]={cat:'w',hours:8,ot:1};
    else if(w===6)days[k(d)]={cat:'n',hours:8,ot:3};
  }
  return {open:{sal:true,srep:true,sdi:true},fired:{},view:'cal',fin:{tx:[],rec:[],learn:{}},fsub:'mes',ym:[y,m],per:'m',money:'sep',filter:'',
    cats:[
      {id:'m',name:'Mañana',color:'#f59e0b',icon:'☀️',kind:'work',start:'06:00',hours:8},
      {id:'t',name:'Tarde',color:'#3b82f6',icon:'🌇',kind:'work',start:'14:00',hours:8},
      {id:'n',name:'Noche',color:'#6366f1',icon:'🌙',kind:'work',start:'22:00',hours:8},
      {id:'w',name:'Día trabajado',color:'#10b981',icon:'💼',kind:'work',start:'08:00',hours:8},
      {id:'v',name:'Vacaciones',color:'#ec4899',icon:'🏖️',kind:'vacation',hours:8},
      {id:'f',name:'Festivo',color:'#ef4444',icon:'🎉',kind:'holiday',hours:8},
      {id:'b',name:'Baja / permiso retribuido',color:'#8b5cf6',icon:'🩺',kind:'leave',hours:8}],
    days,set:{notif:{on:false,inOn:true,inMin:15,inMsg:'Hora de ir a trabajar: {turno} a las {hora}.',outOn:true,outMin:0,outMsg:'Tu jornada ({turno}) termina a las {hora}. ¡Buen descanso!',holOn:true,holWhen:'before',holTime:'20:00',holMsg:'{cuando} es festivo: {nombre}.'},fixedOn:false,fixedFrom:`${y}-${pad(m+1)}-01`,fixed:{1:'w',2:'w',3:'w',4:'w',5:'w',6:'',0:''},theme:'auto',mode:'hora',monthly:1500,fin:{al:80,rd:2},split:{src:'cal',fixed:1500,items:[{id:'p1',name:'Vivienda',color:'#10b981',amt:525},{id:'p2',name:'Comida',color:'#f59e0b',amt:300},{id:'p3',name:'Transporte',color:'#3b82f6',amt:120},{id:'p4',name:'Ocio',color:'#ec4899',amt:150},{id:'p5',name:'Ahorro',color:'#6366f1',amt:300,sv:true},{id:'p6',name:'Otros',color:'#14b8a6',amt:105}]},rate:12,rateWk:18,rateWe:24,vac:22,payAbs:true,cur:'€'}};
}
function load(){let d=defaults();try{const r=localStorage.getItem(KEY);if(r){d=JSON.parse(r);d.set=Object.assign(defaults().set,d.set);d.fin=d.fin||{tx:[],rec:[],learn:{}};d.fin.learn=d.fin.learn||{};d.fsub=d.fsub||'mes';d.set.split.items.forEach(x=>{if(x.sv===undefined)x.sv=/ahorr/i.test(x.name)});if(!['cal','sum','fin','set'].includes(d.view))d.view='cal';d.fired=d.fired||{};d.open=d.open||{sal:true};if(d.open.srep===undefined)d.open.srep=true;if(d.open.sdi===undefined)d.open.sdi=true;(d.cats||[]).forEach(c=>{if(c.kind==='work'&&!c.start)c.start=({m:'06:00',t:'14:00',n:'22:00'})[c.id]||'08:00'})}}catch(e){}return d}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}clearTimeout(T);T=setTimeout(syncNative,800)}
const cat=id=>S.cats.find(c=>c.id===id);
const key=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;

const hh=n=>(Math.round(n*100)/100).toLocaleString('es-ES')+' h';

/* ---------- LÓGICA DE CÁLCULO ---------- */
function autoCat(k){
  const s=S.set;if(!s.fixedOn||!s.fixedFrom||k<s.fixedFrom)return '';
  const c=s.fixed[new Date(k+'T00:00:00').getDay()];return c&&cat(c)?c:'';
}
function getDay(k){
  const e=S.days[k];if(e)return e;
  const a=autoCat(k);return a?{cat:a,hours:cat(a).hours,ot:0,auto:true}:null;
}
function datesFor(prefix){
  const out=new Set(Object.keys(S.days).filter(k=>k.startsWith(prefix)));
  const add=(a,b)=>{for(let t=new Date(a+'T00:00:00');t<=b;t.setDate(t.getDate()+1))out.add(key(t.getFullYear(),t.getMonth(),t.getDate()))};
  if(prefix.length===7){const[y,m]=prefix.split('-').map(Number);add(`${prefix}-01`,new Date(y,m,0))}
  else if(prefix.length===4)add(`${prefix}-01-01`,new Date(+prefix,11,31));
  else if(S.set.fixedOn&&S.set.fixedFrom){const n=new Date();add(S.set.fixedFrom,new Date(n.getFullYear(),n.getMonth()+1,0))}
  return out;
}
function calc(prefix){
  const r={days:0,byCat:{},ordH:0,otWk:0,otWe:0,vacDays:0},ds=datesFor(prefix);
  for(const k of ds){
    const e=getDay(k),c=e&&cat(e.cat);if(!c)continue;
    r.byCat[c.id]=(r.byCat[c.id]||0)+1;
    if(c.kind==='work'){r.days++;r.ordH+=e.hours}
    else if(['vacation','holiday','leave'].includes(c.kind))r.ordH+=e.hours;
    if(c.kind==='vacation')r.vacDays++;
    if(e.ot>0){if(isWe(k,c))r.otWe+=e.ot;else r.otWk+=e.ot}
  }
  const mon=S.set.mode==='mensual',nm=prefix.length===7?1:prefix.length===4?12:new Set([...ds].map(k=>k.slice(0,7))).size;
  r.base=mon?S.set.monthly*nm:r.ordH*S.set.rate;r.payWk=r.otWk*S.set.rateWk;r.payWe=r.otWe*S.set.rateWe;
  r.total=r.base+r.payWk+r.payWe;
  return r;
}
const counter=(r,f)=>f?(r.byCat[f]||0):r.days;

function toast(t,b){
  let el=$('#toast');
  if(!el){el=document.createElement('div');el.id='toast';el.onclick=()=>el.classList.remove('on');$('#app').appendChild(el)}
  el.innerHTML='<b>'+esc(t)+'</b><div>'+esc(b)+'</div>';

  clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),6000);
}
function fire(t,b){
  toast(t,b);
  try{if(!native()&&typeof Notification!=='undefined'&&Notification.permission==='granted')new Notification(t,{body:b})}catch(e){}
}
function buildEvents(from,days){
  const n=S.set.notif,out=[],f=new Date(from.getFullYear(),from.getMonth(),from.getDate());
  const hm=t=>`${pad(t.getHours())}:${pad(t.getMinutes())}`;
  for(let i=0;i<days;i++){
    const d=new Date(f);d.setDate(f.getDate()+i);
    const k=key(d.getFullYear(),d.getMonth(),d.getDate()),e=getDay(k),c=e&&cat(e.cat);if(!c)continue;
    if(c.kind==='work'&&c.start){
      const st=new Date(`${k}T${c.start}:00`),en=new Date(st.getTime()+(e.hours||c.hours||0)*3600000);
      const fill=(m,t)=>m.replace(/\{turno\}/g,c.name).replace(/\{hora\}/g,hm(t));
      if(n.inOn)out.push({id:'i'+k,title:'Hora de entrada',at:new Date(st.getTime()-n.inMin*60000),body:fill(n.inMsg,st)});
      if(n.outOn)out.push({id:'o'+k,title:'Hora de salida',at:new Date(en.getTime()-n.outMin*60000),body:fill(n.outMsg,en)});
    }
    if(c.kind==='holiday'&&n.holOn){
      const[h1,m1]=(n.holTime||'20:00').split(':').map(Number);
      const at=new Date(d.getFullYear(),d.getMonth(),d.getDate()-(n.holWhen==='before'?1:0),h1,m1);
      const nm=(e.note||'').trim()||c.name;
      out.push({id:'h'+k,title:'Día festivo',at,body:n.holMsg.replace(/\{cuando\}/g,n.holWhen==='before'?'Mañana':'Hoy').replace(/\{nombre\}/g,nm)});
    }
  }
  return out;
}
function tick(){
  const n=S.set.notif;if(!n||!n.on)return;
  const now=Date.now(),f=S.fired=S.fired||{};let ch=false;
  buildEvents(new Date(now-86400000),3).forEach(ev=>{
    const t=ev.at.getTime(),id=ev.id+'@'+t;
    if(t<=now&&now-t<=120000&&!f[id]){f[id]=now;ch=true;fire(ev.title,ev.body)}
  });
  for(const k in f)if(now-f[k]>2*86400000){delete f[k];ch=true}
  if(ch)save();
}
async function syncNative(){
  const LN=native();if(!LN)return;
  try{
    const p=await LN.getPending();
    if(p&&p.notifications&&p.notifications.length)await LN.cancel({notifications:p.notifications});
    if(!S.set.notif.on||PERM!=='granted')return;
    const now=Date.now();
    const evs=buildEvents(new Date(),30).filter(e=>e.at.getTime()>now).sort((a,b)=>a.at-b.at).slice(0,120);
    if(evs.length)await LN.schedule({notifications:evs.map((e,i)=>({id:i+1,title:e.title,body:e.body,channelId:'avisos',schedule:{at:e.at,allowWhileIdle:true}}))});
  }catch(err){}
}

/* ---------- REPARTO DEL SUELDO ---------- */
const PAL=['#10b981','#f59e0b','#3b82f6','#ec4899','#6366f1','#14b8a6','#ef4444','#8b5cf6'];
const pc=n=>(Math.round(n*10)/10).toLocaleString('es-ES');
function mBase(){const sp=S.set.split;return sp.src==='fix'?sp.fixed:calc(`${S.ym[0]}-${pad(S.ym[1]+1)}`).total}
function splitInfo(){const sp=S.set.split,tot=sp.items.reduce((a,x)=>a+(x.amt||0),0);return{sp,tot}}
function migAmt(){const sp=S.set.split;if(!sp.items.some(x=>x.amt===undefined))return;let b=mBase();if(!(b>0))b=sp.fixed>0?sp.fixed:1500;sp.items.forEach(x=>{if(x.amt===undefined){x.amt=Math.round(b*(x.pct||0)/100);delete x.pct}});save()}
function vSplit(r){
  const{sp,tot}=splitInfo(),fix=sp.src==='fix',k=S.per==='m'?1:12,base=fix?sp.fixed*k:r.total,T=tot*k,diff=Math.round((base-T)*100)/100;
  const[yy,mm]=S.ym,pre=S.per==='m'?`${yy}-${pad(mm+1)}`:`${yy}`,by={};
  S.fin.tx.filter(x=>x.d.startsWith(pre)).forEach(x=>by[x.c]=(by[x.c]||0)+x.a);
  let gt=0;sp.items.forEach(x=>{if(!x.sv)gt+=by[x.id]||0});
  const un=Object.keys(by).filter(id=>!sp.items.some(x=>x.id===id)).reduce((a,id)=>a+by[id],0);gt+=un;
  let b=`<div class="row"><span>Para repartir <span class="mu">${fix?'importe fijo':'según tu calendario'}</span></span><b>${money(base)}</b></div>`;
  if(!sp.items.length)b+='<p class="mu" style="margin:6px 0">Aún no tienes porciones. Créalas en Ajustes → Reparto del sueldo.</p>';
  else{
    if(base<=0)b+='<p class="mu" style="margin:6px 0">Todavía no hay ingresos en este periodo. Marca días en el calendario o indica un importe fijo en Ajustes.</p>';
    const den=Math.max(base,T)||1;
    b+='<div class="bar">'+sp.items.map(x=>`<div style="width:${(x.amt||0)*k/den*100}%;background:${esc(x.color)}"></div>`).join('')+'</div>';
    b+='<div class="sg"><span></span><span class="h">Porcionado</span><span class="h">Gastado</span>'+sp.items.map(x=>{const g=by[x.id]||0,am=(x.amt||0)*k,over=!x.sv&&g>am+0.005;return `<span><span class="dot" style="--c:${esc(x.color)}"></span>${esc(x.name)}${x.sv?' 💰':''}</span><b class="r">${money(am)}</b><span class="r" style="${over?'color:#e5484d;font-weight:700':''}">${x.sv?'ahorrado ':''}${money(g)}</span>`}).join('')+(un>0?`<span>Sin porción</span><b class="r">—</b><span class="r">${money(un)}</span>`:'')+`<span class="tt">Total</span><b class="r tt">${money(T)}</b><b class="r tt">${money(gt)}</b></div>`;
    if(Math.abs(diff)>0.005)b+=`<div class="row" style="border-top:1px solid var(--bd);margin-top:4px;padding-top:8px;${diff<0?'color:#e5484d':''}"><span>${diff>0?'Sin repartir':'Te pasas'}</span><b>${money(Math.abs(diff))}</b></div>`;
  }
  b+='<button class="btn g" style="width:100%;margin-top:10px" onclick="S.open=S.open||{};S.open.rep=true;go(\'set\')">Editar reparto</button>';
  return{s:sp.items.length?`${money(base)} · ${money(gt)} gastado`:'Sin porciones',b};
}
function splitSec(){

    +'<div class="sd" style="margin-top:8px">Los días automáticos se ven con borde discontinuo. Toca uno para añadir horas extra, cambiarlo o dejarlo libre.</div>';
  const f=(s.fixedFrom||'').split('-').reverse().join('/');
  return sec('fij','Horario fijo',s.fixedOn?`Activo desde ${f}`:'Desactivado',b);
}
function catsCard(){
  const b=S.cats.map((c,i)=>`<div class="cc"><div class="ct"><input type="color" value="${esc(c.color)}" onchange="S.cats[${i}].color=this.value;save()" aria-label="Color"><input value="${esc(c.name)}" onchange="S.cats[${i}].name=this.value||'Sin nombre';save()"><button class="chip" onclick="delCat(${i})">Eliminar</button></div>
    <div class="sr" style="border:0;padding:8px 0 0"><div class="sl" style="font-weight:600">Tipo</div><select class="sel" onchange="setKind(${i},this.value)">${Object.entries(KIND).map(([k,v])=>`<option value="${k}"${c.kind===k?' selected':''}>${v}</option>`).join('')}</select></div>
    ${c.kind==='work'?`<div class="cs" style="margin:8px 0 0"><label>Entrada<input type="time" value="${esc(c.start||'08:00')}" onchange="S.cats[${i}].start=this.value;save()"></label><label>Horas<input type="number" inputmode="decimal" step="0.25" min="0" value="${c.hours}" onchange="S.cats[${i}].hours=num(this.value);save()"></label></div>`:''}</div>`).join('')
    +'<button class="btn g" style="width:100%" onclick="addCat()">Añadir categoría</button>';
  return sec('cat','Categorías y colores',`${S.cats.length} categorías`,b);
}
function dataCard(){
  return sec('dat','Datos','Borrar o restablecer',
    srow('Borrar registros','Elimina todos los días y notas marcados','<button class="btn g" style="padding:8px 14px" onclick="askClear()">Borrar</button>')
    +srow('Restablecer la app','Todo vuelve a los valores iniciales','<button class="btn r" style="padding:8px 14px" onclick="askReset()">Restablecer</button>'));
}
function notifCard(){
  const n=S.set.notif,ps=permState();
  const st={granted:'Permiso concedido',denied:'Permiso denegado',default:'Falta el permiso',none:'Solo dentro de la app'}[ps];
  const hint={denied:'Actívalo en los ajustes del dispositivo.',none:'Este navegador no admite notificaciones del sistema; verás los avisos dentro de la app.'}[ps]||'';
  const mins=[[0,'A la hora'],[5,'5 min antes'],[10,'10 min antes'],[15,'15 min antes'],[30,'30 min antes'],[60,'1 hora antes']];
  const sel=(k,o)=>`<select class="sel" onchange="setN('${k}',this.value)">${o.map(([v,l])=>`<option value="${v}"${String(n[k])===String(v)?' selected':''}>${l}</option>`).join('')}</select>`;
  const tog=(k,l,d)=>srow(l,d,swc(n[k],`setN('${k}',this.checked,1)`));
  const msg=k=>`<div class="f" style="padding:6px 0 4px"><label>Mensaje</label><input value="${esc(n[k])}" onchange="setN('${k}',this.value)"></div>`;
  let b=permCenter()+srow('Activar avisos','Recordatorios de tu jornada',swc(n.on,'setMaster(this.checked)'));
  if(n.on){
    b+='<div class="sh">Entrada</div>'+tog('inOn','Al entrar al trabajo','')+(n.inOn?srow('Cuándo','',sel('inMin',mins))+msg('inMsg'):'');
    b+='<div class="sh">Salida</div>'+tog('outOn','Al salir del trabajo','')+(n.outOn?srow('Cuándo','',sel('outMin',mins))+msg('outMsg'):'');
    b+='<div class="sh">Festivos</div>'+tog('holOn','Avisar de los festivos','')
      +(n.holOn?srow('Cuándo','',sel('holWhen',[['before','El día anterior'],['same','El mismo día']]))+srow('A las','',`<input type="time" class="sel" value="${esc(n.holTime)}" onchange="setN('holTime',this.value)">`)+msg('holMsg'):'');
    b+='<button class="btn g" style="width:100%;margin-top:12px" onclick="testN()">Enviar aviso de prueba</button><div class="sd" style="margin-top:10px">Variables en los mensajes: {turno}, {hora}, {nombre} y {cuando}. La hora de entrada y las horas de cada turno se ajustan en Categorías.</div><div class="sd" style="margin-top:6px">'+(native()?'Los avisos llegan aunque la app esté cerrada.':'Estás en el navegador: los avisos solo llegan con la app abierta. Instala el APK para recibirlos con la app cerrada.')+'</div>';
  }
  const on=[n.inOn&&'Entrada',n.outOn&&'Salida',n.holOn&&'Festivos'].filter(Boolean);
  return sec('avi','Avisos',n.on?(on.join(' · ')||'Sin avisos activos'):'Desactivados',b);
}
function setMode(m){S.set.mode=m;save();render()}
function addCat(){S.cats.push({id:'c'+Date.now(),name:'Nueva categoría',color:'#14b8a6',icon:'⭐',kind:'work',start:'08:00',hours:8});save();render()}
let PEND=null;
function ask(msg,label,fn){PEND=fn;E=null;$('#sheet').innerHTML=`<h2>${esc(msg)}</h2><div style="display:flex;gap:8px;margin-top:16px"><button class="btn g" style="flex:1" onclick="closeSheet()">Cancelar</button><button class="btn r" style="flex:1" onclick="runPend()">${esc(label)}</button></div>`;$('#ov').classList.add('on')}
function askClear(){ask('¿Borrar todos los días registrados?','Borrar',()=>{S.days={};save();render()})}
function askReset(){ask('¿Restablecer todo (categorías, tarifas y registros)?','Restablecer',()=>{S=defaults();save();applyTheme();render()})}
function runPend(){const f=PEND;PEND=null;closeSheet();if(f)f()}
function delCat(i){const c=S.cats[i];ask(`¿Eliminar "${c.name}" y los días que la usan?`,'Eliminar',()=>{for(const k in S.days)if(S.days[k].cat===c.id)delete S.days[k];S.cats.splice(i,1);save();render()})}


/* ---------- HOJA DE EDICIÓN DE DÍA ---------- */
function openDay(k){
  const e=getDay(k);
  E={k,cat:e?e.cat:'',hours:e?e.hours:'',ot:e?e.ot:0,note:e?e.note||'':'',had:!!e&&!e.auto,auto:!!(e&&e.auto)};
  if(!e&&S.cats.length){E.cat=S.cats[0].id;E.hours=S.cats[0].hours}
  sheet();$('#ov').classList.add('on');
}
function closeSheet(){$('#ov').classList.remove('on');E=null}
function readIn(){const a=$('#sh'),b=$('#so');if(a)E.hours=a.value;if(b)E.ot=b.value;const n=$('#sn');if(n)E.note=n.value}
function pick(id){readIn();const c=cat(id);E.cat=id;E.hours=c?c.hours:'';sheet()}
function sheet(){
  const[y,m,d]=E.k.split('-').map(Number),c=cat(E.cat),we=isWe(E.k,c);
  const dn=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'][new Date(E.k+'T00:00:00').getDay()];
  $('#sheet').innerHTML=`<h2 style="text-transform:capitalize">${dn} ${d} de ${MES[m-1].toLowerCase()}</h2>
  ${E.auto?'<p class="mu" style="margin:6px 0 0">Horario fijo aplicado. Solo añade las horas extra si las hiciste.</p>':''}<h3 style="margin-top:12px">Tipo de jornada</h3><div class="chips"><button class="chip${E.cat===''?' on':''}" onclick="pick('')">Ninguna</button>${S.cats.map(x=>`<button class="chip${E.cat===x.id?' on':''}" style="--c:${esc(x.color)}" onclick="pick('${x.id}')"><span class="dot"></span>${esc(x.name)}</button>`).join('')}</div>
  <div style="display:flex;gap:10px;margin-top:14px"><div class="f"><label>Horas ordinarias</label><input id="sh" type="number" inputmode="decimal" step="0.25" min="0" value="${E.hours}"></div><div class="f"><label>Horas extra</label><input id="so" type="number" inputmode="decimal" step="0.25" min="0" value="${E.ot||0}"></div></div>
  <div class="f" style="margin-top:12px"><label>Nota</label><textarea id="sn" rows="3" placeholder="Escribe una nota para este día...">${esc(E.note||'')}</textarea></div>
  <p class="mu">Las horas extra de este día se pagarán con la tarifa de <b>${we?'fin de semana / festivo':'entre semana'}</b> (${we?S.set.rateWe:S.set.rateWk} ${esc(S.set.cur)}/h).</p>
  <div style="display:flex;gap:8px;margin-top:10px">${E.had?'<button class="btn r" onclick="delDay()">Quitar</button>':''}<button class="btn g" style="flex:1" onclick="closeSheet()">Cancelar</button><button class="btn" style="flex:2" onclick="saveDay()">Guardar</button></div>`;
}
function saveDay(){
  readIn();const note=(E.note||'').trim(),a=autoCat(E.k),ac=a?cat(a):null;
  if(!E.cat&&!note){if(a)S.days[E.k]={cat:'',hours:0,ot:0,note:''};else delete S.days[E.k]}
  else if(ac&&E.cat===a&&num(E.hours)===ac.hours&&!num(E.ot)&&!note)delete S.days[E.k];
  else S.days[E.k]={cat:E.cat,hours:num(E.hours),ot:num(E.ot),note};
  save();closeSheet();render();
}
function delDay(){delete S.days[E.k];save();closeSheet();render()}

(function(){const mn=$('#main');if(!mn.addEventListener)return;let y0=0;
  mn.addEventListener('touchstart',e=>{y0=e.touches[0].clientY},{passive:true});
  mn.addEventListener('touchmove',e=>{if(mn.scrollTop<=0&&e.touches[0].clientY>y0&&e.cancelable)e.preventDefault()},{passive:false});
})();
S=load();migAmt();fproc();applyTheme();
S.view='cal';{const n0=new Date();S.ym=[n0.getFullYear(),n0.getMonth()]}S.per='m';
render();
if(native()){refreshPerm().then(()=>{if(PERM==='granted')makeChannel();if(!S.set.notifAsked&&PERM!=='granted')permSheet();else{S.set.notifAsked=true;render()}syncNative()}).catch(()=>{})}
function onResume(){tick();refreshPerm().then(()=>{if(S.view==='set'||S.view==='cal')render();syncNative()})}
setInterval(tick,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)onResume()});tick();
try{const AP=typeof Capacitor!=='undefined'&&Capacitor.Plugins&&Capacitor.Plugins.App;if(AP&&AP.addListener)AP.addListener('resume',onResume)}catch(e){}
</script>
